<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus Store — Sign In</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body" data-testid="login-body">

<main class="login-page" id="loginPage" data-testid="login-page">
  <div class="login-card" id="loginCard" data-testid="login-card">
    <a href="login.html" class="logo login-logo" id="loginLogo" data-testid="login-logo">Nimbus<span>Store</span></a>
    <h1 id="loginTitle" data-testid="login-title">Sign In</h1>
    <p class="login-subtitle" id="loginSubtitle" data-testid="login-subtitle">
      Sign in to browse the catalog and shop.
    </p>

    <form id="loginForm" name="loginForm" data-testid="login-form">
      <div class="form-row">
        <label for="username">Username
          <input
            type="text"
            id="username"
            name="username"
            data-testid="login-username-input"
            autocomplete="username"
            placeholder="demo"
            required>
        </label>
      </div>
      <div class="form-row">
        <label for="password">Password
          <input
            type="password"
            id="password"
            name="password"
            data-testid="login-password-input"
            autocomplete="current-password"
            placeholder="••••••••"
            required>
        </label>
      </div>

      <p id="loginError" class="login-error" data-testid="login-error-message" hidden>
        Incorrect username or password.
      </p>

      <button
        type="submit"
        id="loginSubmit"
        name="loginSubmit"
        class="btn btn-primary btn-block"
        data-testid="login-submit-button">
        Sign In
      </button>
    </form>

    <p class="demo-credentials" id="demoCredentials" data-testid="demo-credentials-label">
      🧪 <strong>Test credentials</strong> (for educational / testing purposes):<br>
      Username: <code id="demoUsername" data-testid="demo-username-value">demo</code>
      &nbsp;·&nbsp;
      Password: <code id="demoPassword" data-testid="demo-password-value">demo1234</code>
    </p>
  </div>
</main>

<script src="login.js"></script>
</body>
</html>
